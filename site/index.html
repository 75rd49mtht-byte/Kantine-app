<!DOCTYPE html>
<html lang="nl">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Arnhemse Boys Schuytgraaf — Kantinediensten</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#141216">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Kantinedienst">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<style>
  :root{
    --bg:#141216; --panel:#1e1a1f; --panel2:#282430; --line:#3a343f;
    --text:#f1ecee; --muted:#a99ea6; --accent:#e11d2a; --accent-d:#b3141f;
    --ok:#22c55e; --gold:#f0b429; --bar:#f0b429; --chip:#2d2733; --radius:14px;
  }
  *{box-sizing:border-box} html,body{margin:0;padding:0}
  body{background:var(--bg);color:var(--text);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding-bottom:80px}
  button{font:inherit;cursor:pointer} input{font:inherit}
  header{position:sticky;top:0;z-index:20;background:linear-gradient(180deg,#2c0a0d,#141216);
    border-bottom:2px solid var(--gold);padding:12px 16px;padding-top:calc(12px + env(safe-area-inset-top,0));
    display:flex;align-items:center;gap:10px}
  .brandlogo{width:38px;height:41px;object-fit:contain;flex:0 0 auto;filter:drop-shadow(0 1px 2px rgba(0,0,0,.5))}
  header .grow{flex:1 1 auto;min-width:0}
  header h1{margin:0;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  header .sub{color:var(--muted);font-size:12px}
  main{max-width:760px;margin:0 auto;padding:16px}
  .muted{color:var(--muted)}
  .btn{background:var(--accent);color:#fff;border:none;border-radius:10px;padding:11px 16px;font-weight:700}
  .btn:active{transform:translateY(1px)} .btn.block{width:100%;display:flex;justify-content:center}
  .btn.ghost{background:transparent;color:var(--muted);border:1px solid var(--line)}
  .btn.sm{padding:6px 10px;font-size:13px;border-radius:8px}

  /* Login */
  #login{position:fixed;inset:0;z-index:100;background:radial-gradient(120% 90% at 50% 0%,#3a0e12,#141216 70%);
    display:flex;align-items:center;justify-content:center;padding:20px}
  #login.hide{display:none!important}
  .loginbox{width:100%;max-width:360px;background:var(--panel);border:1px solid var(--line);border-top:3px solid var(--gold);
    border-radius:18px;padding:26px 22px;text-align:center}
  .loginbox .brandlogo{width:80px;height:85px;margin:0 auto 12px;display:block}
  .loginbox h2{margin:0 0 2px} .loginbox p{margin:0 0 4px}
  .tabs{display:flex;background:var(--panel2);border:1px solid var(--line);border-radius:10px;overflow:hidden;margin:16px 0}
  .tabs button{flex:1;background:transparent;border:none;color:var(--muted);padding:9px;font-weight:600}
  .tabs button.on{background:var(--accent);color:#fff}
  .pane{display:none} .pane.on{display:block}
  label.fld{display:block;text-align:left;font-size:12.5px;color:var(--muted);margin:10px 0 4px}
  input[type=text],input[type=email],input[type=password]{width:100%;background:var(--panel2);color:var(--text);
    border:1px solid var(--line);border-radius:10px;padding:11px;letter-spacing:.5px}
  input:focus{outline:none;border-color:var(--gold)}
  #codeInput{text-transform:lowercase;text-align:center;font-size:20px;letter-spacing:4px}
  .err{color:#ff8a8a;font-size:13px;min-height:18px;margin-top:8px}
  .hint{color:var(--muted);font-size:12px;margin-top:12px}

  .card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:14px;margin-bottom:12px}
  .sat{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px;margin-bottom:10px}
  .sat.open{border-color:#5a4a1e}
  .sat .date{font-weight:700;font-size:15px;text-transform:capitalize}
  .sathead{display:flex;align-items:center;gap:8px;cursor:pointer}
  .hstatus{display:flex;flex-wrap:wrap;gap:5px;align-items:center;margin-top:4px}
  .chip.mini{padding:2px 8px;font-size:11.5px}
  .mini{font-size:11.5px;padding:2px 7px;border-radius:6px;background:var(--panel2);border:1px solid var(--line);color:var(--muted);white-space:nowrap}
  .mini.okm{color:#7ee2a4;border-color:#1e4d31;background:#0f2418}
  .mini.warnm{color:var(--gold);border-color:#4a3a17;background:#241d0f}
  .chev{color:var(--muted);font-size:13px;flex:0 0 auto;align-self:flex-start;padding-top:2px}
  .satbody{margin-top:10px}
  .progress{height:7px;background:var(--panel2);border-radius:999px;overflow:hidden;margin:10px 0 4px}
  .progress i{display:block;height:100%;background:var(--ok);width:0;transition:width .25s}
  .prlabel{font-size:12.5px;color:var(--muted)}
  .chip{display:inline-flex;align-items:center;gap:6px;background:var(--chip);border:1px solid var(--line);border-radius:999px;padding:4px 10px;font-size:13px}
  .chip.staff{background:#2c2510;border-color:#5a4a1e;color:#f2cf7a}
  .barsec{border:1px solid #5a4a1e;background:#221c0e;border-radius:11px;padding:10px 12px;margin-top:10px}
  .barhead{font-weight:600;font-size:13px;color:var(--bar);margin-bottom:2px}
  .barslot{padding:7px 0;border-top:1px dashed var(--line)} .barslot:first-of-type{border-top:none}
  .slabel{font-size:12.5px;color:var(--muted)} .warnv{color:var(--gold);font-size:12.5px}
  .block{border:1px solid var(--line);border-radius:11px;padding:10px 12px;margin-top:10px;background:var(--panel2)}
  .block.done{border-color:#1e4d31;background:#0f2418}
  .bhead{display:flex;justify-content:space-between;align-items:center;gap:8px}
  .btime{font-weight:600}
  .pill{font-size:11.5px;padding:2px 9px;border-radius:999px;background:var(--chip);border:1px solid var(--line);color:var(--muted);white-space:nowrap}
  .pill.ok{color:#7ee2a4;border-color:#1e4d31;background:#0f2418}
  .pill.open{color:var(--gold);border-color:#4a3a17;background:#241d0f}
  .task{display:flex;align-items:center;gap:9px;padding:8px 0;border-top:1px dashed var(--line)}
  .task:first-of-type{border-top:none}
  .task input[type=checkbox]{width:22px;height:22px;accent-color:var(--ok);flex:0 0 auto}
  .task .tname{font-weight:600} .task.checked .tname{color:#7ee2a4}
  .task .tnote{flex:1 1 90px;min-width:80px;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:7px 9px;color:var(--text);font-size:13px}
  .empty{text-align:center;color:var(--muted);padding:24px 10px}
  .saving{position:fixed;bottom:calc(112px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);
    background:#0b1a10;border:1px solid var(--ok);pointer-events:none;
    color:#c9f3d8;padding:8px 14px;border-radius:10px;font-size:13px;opacity:0;transition:opacity .2s;z-index:60}
  .saving.show{opacity:1}
  .saving.err{background:#2a1416;border-color:#f87171;color:#ffd9dc}
  .hide{display:none!important}
  .spread{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
  .selin{background:var(--panel2);color:var(--text);border:1px solid var(--line);border-radius:9px;padding:8px 10px;max-width:230px}
  .selin:focus{outline:none;border-color:var(--gold)}
  .miniadd{max-width:200px;padding:7px 9px;font-size:13px;margin-top:6px}
  .chip .x{cursor:pointer;color:var(--muted);font-weight:700;margin-left:3px}
  .roname{color:var(--muted);font-size:13px;margin-left:auto}
  nav.tabs{position:fixed;bottom:0;left:0;right:0;z-index:40;display:flex;background:var(--panel);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0)}
  nav.tabs button{flex:1;background:transparent;border:none;color:var(--muted);padding:10px 4px;font-size:12px;display:flex;flex-direction:column;align-items:center;gap:3px}
  nav.tabs button .ico{font-size:20px}
  nav.tabs button.on{color:var(--accent)}
  .banner{background:#241d0f;border:1px solid #4a3a17;color:#f6c66a;border-radius:12px;padding:10px 13px;margin-bottom:12px;font-size:13.5px}
  .banner.good{background:#0f2418;border-color:#1e4d31;color:#7ee2a4}
  .ovwrap{overflow-x:auto;-webkit-overflow-scrolling:touch;border:1px solid var(--line);border-radius:12px}
  .ovtable{width:100%;border-collapse:collapse;font-size:13px;min-width:520px}
  .ovtable th,.ovtable td{border-bottom:1px solid var(--line);border-right:1px solid var(--line);padding:7px 9px;text-align:left;vertical-align:top}
  .ovtable th{background:var(--panel2);color:var(--muted);font-weight:600}
  .ovtable tr:last-child td{border-bottom:none}
  .ovtable td:last-child,.ovtable th:last-child{border-right:none}
  .ovtable td.gap{background:#241d0f}
  .ovdate{white-space:nowrap;font-weight:600}.ovteam{color:var(--muted);white-space:nowrap}
  .ovcell{min-width:150px}.ovcell .chip{margin:2px 3px 2px 0}
  .wltable{width:100%;border-collapse:collapse;font-size:13px}
  .wltable th,.wltable td{padding:7px 8px;border-bottom:1px solid var(--line);text-align:left}
  .wltable th{color:var(--muted);font-weight:600;font-size:12px}
  .wltable td.num,.wltable th.num{text-align:center;font-variant-numeric:tabular-nums}
  .wltable tr:last-child td{border-bottom:none}
  .wltable .done{color:#7ee2a4;font-weight:700}
  .wlbar{height:6px;border-radius:999px;background:var(--gold);display:inline-block;vertical-align:middle;margin-right:6px}
  h2.tabttl{margin:0 0 4px;font-size:19px}
  .subtabs{display:flex;gap:6px;margin-bottom:12px}
  .subtabs button{flex:1;background:var(--panel2);border:1px solid var(--line);color:var(--muted);border-radius:9px;padding:9px;font-weight:600}
  .subtabs button.on{background:var(--accent);color:#fff;border-color:var(--accent)}
  .infoi{cursor:pointer;font-size:14px;flex:0 0 auto;opacity:.85;margin-left:4px}
  #infoModal{position:fixed;inset:0;z-index:120;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;padding:20px}
  #infoModal.hide{display:none!important}
  .infobox{width:100%;max-width:420px;background:var(--panel);border:1px solid var(--line);border-top:3px solid var(--gold);border-radius:16px;overflow:hidden}
  .infohd{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line);font-weight:700}
  .infohd .x{cursor:pointer;color:var(--muted);font-weight:700;font-size:20px;line-height:1}
  .infobody{padding:16px;white-space:pre-wrap;max-height:60vh;overflow:auto;color:var(--text)}
  .infota{width:100%;min-height:62px;background:var(--panel2);color:var(--text);border:1px solid var(--line);border-radius:9px;padding:9px 10px;font:14px/1.45 inherit;resize:vertical}
  .filterbar{display:flex;flex-wrap:wrap;gap:10px;margin:4px 0 4px}
  .fitem{display:flex;flex-direction:column;gap:3px;font-size:11px;letter-spacing:.02em;color:var(--muted)}
  .fitem select{max-width:170px}
  .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .list-item{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:9px 0;border-bottom:1px solid var(--line)}
  .list-item:last-child{border-bottom:none}
  .code{font-family:ui-monospace,Menlo,monospace;letter-spacing:1px;background:var(--panel2);color:var(--gold);border:1px solid var(--line);border-radius:7px;padding:6px 8px}
  .btn.dng{background:transparent;color:#ff9a9a;border:1px solid #5a2a30}
  .tempbox{background:#0f2418;border:1px solid #1e4d31;color:#c9f3d8;border-radius:10px;padding:10px 12px;font-size:13px;margin-bottom:12px}
  .tempbox .x{float:right;cursor:pointer;color:#7ee2a4;font-weight:700}
  .card h3{margin-top:0}
  .card input[type=text],.card input[type=email]{width:auto;background:var(--panel2);color:var(--text);border:1px solid var(--line);border-radius:9px;padding:9px 10px}
  .card .code{width:96px}
  #printArea{display:none}
  @media print{
    header,nav.tabs,#login,.saving,main{display:none!important}
    body{background:#fff;color:#111;padding:0}
    #printArea{display:block;color:#111;font:12.5px/1.45 system-ui,Arial,sans-serif}
    #printArea h1{font-size:21px;margin:0 0 2px}
    #printArea .psub{color:#555;font-size:11.5px;margin-bottom:14px}
    #printArea h2{font-size:15px;margin:16px 0 6px;page-break-after:avoid}
    #printArea table{width:100%;border-collapse:collapse;margin-bottom:8px}
    #printArea th,#printArea td{border:1px solid #999;padding:5px 7px;text-align:left;vertical-align:top}
    #printArea th{background:#eee;-webkit-print-color-adjust:exact;print-color-adjust:exact}
    #printArea tr{page-break-inside:avoid}
    #printArea .fill{color:#bbb}
    @page{margin:14mm}
  }
  /* Ruilen */
  .swapbar{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:10px;padding-top:10px;border-top:1px dashed var(--line)}
  .swapbar .lbl{font-size:12.5px;color:var(--muted);flex:1 1 140px;min-width:0}
  .swaprow{border:1px solid var(--line);border-radius:10px;padding:10px;margin:8px 0;background:var(--panel2)}
  .swaprow .ttl{font-weight:700;font-size:13.5px}
  .swaprow .meta{font-size:12.5px;color:var(--muted);margin-top:3px}
  .swaprow .acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px;align-items:center}
  .swaprow .acts input[type=text]{flex:1 1 140px;min-width:0}
  .swapst{display:inline-block;font-size:11.5px;font-weight:700;border-radius:999px;padding:2px 8px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
  .swapst.wait{color:var(--gold);border-color:var(--gold)}
  .swapst.ok{color:var(--ok);border-color:var(--ok)}
  .swapst.no{color:#f87171;border-color:#f87171}
  .swappanel{border:1px dashed var(--line);border-radius:10px;padding:10px;margin-top:8px}
  .swappanel select,.swappanel input[type=text]{width:100%;margin-top:6px}
  .swapsub{font-size:12.5px;color:var(--muted);margin:14px 0 2px;font-weight:600}
  .navcount{background:var(--accent);color:#fff;border-radius:999px;font-size:10.5px;padding:1px 5px;margin-left:4px;font-weight:700}
  /* het actieve tabblad kreeg een rode achtergrond uit de login-tabs met rode tekst erop: onleesbaar */
  nav.tabs button.on{background:transparent;color:var(--accent)}
  nav.tabs button.on .navcount{background:var(--accent);color:#fff}
</style>

function fmtDay(iso){return new Date(iso+'T00:00:00').toLocaleDateString('nl-NL',{weekday:'long',day:'numeric',month:'long'});}

function escapeHtml(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function showInfo(title,text){$('#infoTitle').textContent=title;$('#infoBody').textContent=text||'';$('#infoModal').classList.remove('hide');}
$('#infoClose').onclick=()=>$('#infoModal').classList.add('hide');
$('#infoModal').onclick=e=>{if(e.target.id==='infoModal')$('#infoModal').classList.add('hide');};
$('#infoBtn').onclick=()=>showInfo('Kantine-info',(config&&config.general_info)||'');
function infoBadge(task){const t=((config&&config.task_info)||{})[task];if(!t)return null;const b=el('span','infoi');b.textContent='ℹ️';b.title='Uitleg bij '+task;b.onclick=e=>{e.stopPropagation();showInfo(task,t);};return b;}

/* ---------- Sessie / login ---------- */
let session=null; // {kind:'team',code,teamId,teamName} of {kind:'account',at,rt,exp,uid,role,name}
let config=null;  // {club,blocks,bar_shifts}
let data=null;    // in-memory model (account-modus)
function persist(){localStorage.setItem('abs_session',JSON.stringify(session));}
function doLogout(){beheerNotice=null;beheerNoticeTekst=null;localStorage.removeItem('abs_session');location.reload();}
async function ensureToken(){
  if(!session||session.kind!=='account')return;
  if(Math.floor(Date.now()/1000) > session.exp-60){
    const r=await fetch(`${SB_URL}/auth/v1/token?grant_type=refresh_token`,{method:'POST',headers:{apikey:SB_KEY,'Content-Type':'application/json'},body:JSON.stringify({refresh_token:session.rt})});
    if(!r.ok){doLogout();throw new Error('Sessie verlopen — log opnieuw in.');}
    const j=await r.json();session.at=j.access_token;session.rt=j.refresh_token;session.exp=Math.floor(Date.now()/1000)+j.expires_in;persist();
  }
}
async function authFetch(path,opts){
  await ensureToken();opts=opts||{};
  opts.headers=Object.assign({apikey:SB_KEY,'Authorization':'Bearer '+session.at},opts.headers||{});
  return fetch(SB_URL+path,opts);
}
async function sbGet(q){const r=await authFetch('/rest/v1/'+q);if(!r.ok)throw new Error('Laadfout ('+r.status+')');return r.json();}
async function sbSend(method,q,body,hdr){const r=await authFetch('/rest/v1/'+q,{method,headers:Object.assign({'Content-Type':'application/json'},hdr||{}),body:body!==undefined?JSON.stringify(body):undefined});if(!r.ok)throw new Error('Fout ('+r.status+')');return r;}
const teamName=id=>{const t=((data&&data.teams)||[]).find(x=>x.id===id);return t?t.name:'—';};
const staffName=id=>{const s=((data&&data.barStaff)||[]).find(x=>x.id===id);return s?s.name:'?';};

$('#tabCode').onclick=()=>switchPane('code');
$('#tabAcc').onclick=()=>switchPane('acc');
function switchPane(p){
  $('#tabCode').classList.toggle('on',p==='code');$('#tabAcc').classList.toggle('on',p==='acc');
  $('#paneCode').classList.toggle('on',p==='code');$('#paneAcc').classList.toggle('on',p==='acc');
}

  const code=$('#codeInput').value.trim().toLowerCase();

  if(!code){$('#codeErr').textContent='Vul een teamcode in.';return;}
  $('#codeBtn').disabled=true;$('#codeBtn').textContent='Bezig…';

    if(!config) config=await rpc('public_config',{});

$('#accPass').addEventListener('keydown',e=>{if(e.key==='Enter')$('#accBtn').click();});
$('#accBtn').onclick=async()=>{
  const email=$('#accEmail').value.trim(),pass=$('#accPass').value;
  $('#accErr').textContent='';
  if(!email||!pass){$('#accErr').textContent='Vul e-mail en wachtwoord in.';return;}
  $('#accBtn').disabled=true;$('#accBtn').textContent='Bezig…';
  try{
    const r=await fetch(`${SB_URL}/auth/v1/token?grant_type=password`,{method:'POST',headers:{apikey:SB_KEY,'Content-Type':'application/json'},body:JSON.stringify({email,password:pass})});
    const j=await r.json();
    if(!r.ok) throw new Error(j.error_description||j.msg||'Inloggen mislukt');
    session={kind:'account',at:j.access_token,rt:j.refresh_token,exp:Math.floor(Date.now()/1000)+j.expires_in,uid:j.user.id};
    const prof=await sbGet('profiles?select=name,role&id=eq.'+j.user.id);
    if(!prof.length) throw new Error('Dit account heeft nog geen rol. Vraag de beheerder je toe te voegen.');
    session.role=prof[0].role;session.name=prof[0].name;
    if(!config) config=await rpc('public_config',{});
    persist();
    await enterApp();
  }catch(e){$('#accErr').textContent=e.message;}
  finally{$('#accBtn').disabled=false;$('#accBtn').textContent='Inloggen';}
};

$('#pwBtn').onclick=async()=>{
  const np=prompt('Kies een nieuw wachtwoord (minimaal 10 tekens):');
  if(np==null)return;
  if(np.trim().length<10){alert('Neem minimaal 10 tekens — een korte zin werkt goed en is makkelijk te onthouden.');return;}
  const herhaal=prompt('Typ het nieuwe wachtwoord nog een keer:');
  if(herhaal==null)return;
  if(herhaal!==np){alert('De twee wachtwoorden zijn niet gelijk. Er is niets gewijzigd.');return;}
  try{
    const r=await authFetch('/auth/v1/user',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:np})});

      throw new Error(reden||('serverfout '+r.status));
    }
    saved('Wachtwoord gewijzigd ✓');
  }catch(e){saved('Wijzigen mislukt: '+e.message,true);}

/* ---------- Teamleider-weergave ---------- */
let teamSats=[]; // huidige zaterdagen (uit team_saturdays)
function blockArr(status,block){
  let a=status[block.id];
  if(!Array.isArray(a)||a.length!==block.tasks.length){const o=a||[];a=block.tasks.map((_,i)=>o[i]||{done:false,name:''});status[block.id]=a;}
  return a;
}
async function renderTeamView(){
  const wrap=$('#content');wrap.innerHTML='<div class="empty">Laden…</div>';
  try{
    teamSats=await rpc('team_saturdays',{p_code:session.code});
  }catch(e){
    wrap.innerHTML='';wrap.appendChild(laadfoutKaart(e,renderTeamView));return;
  }
  await loadSwaps();
  wrap.innerHTML='';
  if(!teamSats.length){
    wrap.innerHTML='<div class="empty">Nog geen zaterdagen ingepland voor jouw team.</div>';
    wrap.appendChild(swapSection());
    return;
  }
  const info=el('div','card');
  info.innerHTML=`<b>${escapeHtml(session.teamName)}</b> — vink per blok af wie de dienst invult. Wijzigingen worden meteen bewaard.`;
  wrap.appendChild(info);
  teamSats.forEach(s=>wrap.appendChild(satCard(s)));
  wrap.appendChild(swapSection());
}
function satCard(s){
  if(!s.team_status)s.team_status={};
  const c=el('div','sat');
  c.appendChild(Object.assign(el('div','date'),{textContent:capF(fmtDay(s.date))+(s.label?' — '+s.label:'')}));
  // voortgang
  let done=0,total=0;
  dayBlocks(s).forEach(b=>{const a=blockArr(s.team_status,b);total+=a.length;done+=a.filter(x=>x.done).length;});
  const pr=el('div','progress');const bar=el('i');bar.style.width=(total?Math.round(done/total*100):0)+'%';pr.appendChild(bar);c.appendChild(pr);
  const lbl=el('div','prlabel');lbl.textContent=(total&&done===total)?'✔ Volledig ingevuld':`${done}/${total} taken ingevuld`;c.appendChild(lbl);
  function updateProgress(){let dn=0,tt=0;dayBlocks(s).forEach(bl=>{const ar=blockArr(s.team_status,bl);tt+=ar.length;dn+=ar.filter(x=>x.done).length;});bar.style.width=(tt?Math.round(dn/tt*100):0)+'%';lbl.textContent=(tt&&dn===tt)?'✔ Volledig ingevuld':`${dn}/${tt} taken ingevuld`;}
  // vaste bar (alleen-lezen)
  const bs=el('div','barsec');bs.appendChild(Object.assign(el('div','barhead'),{textContent:'🍺 Vaste bar-kracht'}));
  dayShifts(s).forEach(sh=>{
    const slot=el('div','barslot');
    slot.appendChild(Object.assign(el('div','slabel'),{textContent:`${sh.label} · ${sh.start}–${sh.end}`}));
    const names=(s.bar&&s.bar[sh.id])||[];
    if(names.length){const row=el('div');names.forEach(n=>{const ch=el('span','chip staff');ch.textContent=n;ch.style.marginRight='4px';row.appendChild(ch);});slot.appendChild(row);}
    else{slot.appendChild(Object.assign(el('span','warnv'),{textContent:'⚠ nog geen vaste kracht'}));}
    bs.appendChild(slot);
  });
  c.appendChild(bs);
  // blokken met afvinken
  dayBlocks(s).forEach(block=>{
    const a=blockArr(s.team_status,block);const filled=a.length&&a.every(x=>x.done);
    const b=el('div','block'+(filled?' done':''));
    const bh=el('div','bhead');bh.innerHTML=`<span class="btime">${escapeHtml(block.label)} · ${escapeHtml(block.start)}–${escapeHtml(block.end)}</span>`;
    const pill=el('span','pill '+(filled?'ok':'open'));pill.textContent=filled?'Ingevuld ✓':`${a.filter(x=>x.done).length}/${a.length}`;
    bh.appendChild(pill);b.appendChild(bh);
    block.tasks.forEach((task,i)=>{
      const ts=a[i];const row=el('div','task'+(ts.done?' checked':''));
      const cb=el('input');cb.type='checkbox';cb.checked=ts.done;
      const name=el('div','tname');name.textContent=task;
      const note=el('input','tnote');note.type='text';note.placeholder='naam (optioneel)';note.value=ts.name||'';
      cb.onchange=()=>{ts.done=cb.checked;row.classList.toggle('checked',cb.checked);
        const f=a.length&&a.every(x=>x.done);b.classList.toggle('done',f);
        pill.className='pill '+(f?'ok':'open');pill.textContent=f?'Ingevuld ✓':`${a.filter(x=>x.done).length}/${a.length}`;
        updateProgress();markCell(s,block.id,i);};
      note.oninput=()=>{ts.name=note.value;markCell(s,block.id,i);};
      note.onchange=()=>markCell(s,block.id,i);
      row.appendChild(cb);row.appendChild(name);{const ib=infoBadge(task);if(ib)row.appendChild(ib);}row.appendChild(note);b.appendChild(row);
    });
    c.appendChild(b);
  });
  c.appendChild(swapBar(s));
  return c;
}

function laadfoutKaart(e,opnieuw){
  const c=el('div','card');
  c.innerHTML='<h3>Ophalen mislukt</h3><p class="muted" style="margin-top:0;font-size:13px">'+
    'De gegevens konden niet worden geladen. Controleer je internetverbinding en probeer het opnieuw. '+
    'Blijft dit staan, geef het dan door aan de kantinecoördinator.</p>';
  c.appendChild(Object.assign(el('div','muted'),{textContent:'Melding: '+(e&&e.message?e.message:e),style:'font-size:12px'}));
  const acts=el('div','acts');
  const r=el('button','btn sm');r.textContent='Opnieuw proberen';r.onclick=()=>opnieuw();
  const u=el('button','btn ghost sm');u.textContent='Uitloggen';u.onclick=doLogout;
  acts.appendChild(r);acts.appendChild(u);c.appendChild(acts);
  return c;
}

/* ---------- Ruilen: gedeeld ---------- */
const SWAPST={open:['Open','wait'],wacht_barco:['Wacht op coördinator','wait'],goedgekeurd:['Goedgekeurd','ok'],
  afgewezen:['Afgewezen door team','no'],geweigerd:['Afgewezen door coördinator','no'],ingetrokken:['Ingetrokken','no']};
function swapChip(status){const p=SWAPST[status]||[status,''];const s=el('span','swapst '+p[1]);s.textContent=p[0];return s;}
function satLabel(iso,label){return capF(fmtDay(iso))+(label?' — '+label:'');}

/* ---------- Ruilen: teamleider ---------- */
let swapList=[],swapOptions=null,swapLoadFout=null;
async function loadSwaps(){
  try{swapList=await rpc('team_swap_list',{p_code:session.code});swapLoadFout=null;}
  catch(e){swapList=[];swapLoadFout=e.message||'onbekende fout';}
}
function activeSwapFor(satId){
  return swapList.find(r=>['open','wacht_barco'].includes(r.req_status)&&(r.from_sat_id===satId||r.to_sat_id===satId));
}
function swapBar(s){
  const bar=el('div','swapbar');
  const r=activeSwapFor(s.id);
  if(r){
    let txt;
    if(r.req_kind==='overname') txt=(r.direction==='uit')?'Aangeboden op het prikbord':'Jouw team neemt deze dienst over';
    else txt=(r.direction==='uit')?('Ruilvoorstel naar '+(r.to_team_name||'ander team')):('Ruilvoorstel van '+r.from_team_name+' — reageer onderaan bij Ruilen');
    bar.appendChild(Object.assign(el('div','lbl'),{textContent:txt}));
    bar.appendChild(swapChip(r.req_status));
    if(r.direction==='uit'){
      const b=el('button','btn ghost sm');b.textContent='Intrekken';
      b.onclick=()=>swapAct(r.req_id,'intrek',b);bar.appendChild(b);
    }
    return bar;
  }
  bar.appendChild(Object.assign(el('div','lbl'),{textContent:'Kan je team niet? Ruil met een ander team of bied de dienst aan.'}));
  const b1=el('button','btn ghost sm');b1.textContent='🔁 Ruilen';
  const b2=el('button','btn ghost sm');b2.textContent='📌 Aanbieden';
  b1.onclick=()=>openRuilPanel(s,bar,b1);
  b2.onclick=async()=>{
    if(!confirm('Deze dienstdag aanbieden op het prikbord?\n\nEen ander team kan hem dan overnemen. De kantinecoördinator keurt het daarna goed.'))return;
    await swapCreate({p_code:session.code,p_kind:'overname',p_from_saturday:s.id},b2);
  };
  bar.appendChild(b1);bar.appendChild(b2);
  return bar;
}
async function openRuilPanel(s,bar,btn){
  if(bar.parentNode.querySelector('.swappanel'))return;
  btn.disabled=true;
  const panel=el('div','swappanel');panel.textContent='Dienstdagen van andere teams ophalen…';
  bar.parentNode.insertBefore(panel,bar.nextSibling);
  if(!swapOptions){
    try{swapOptions=await rpc('team_swap_options',{p_code:session.code});}
    catch(e){panel.textContent='Ophalen mislukt: '+e.message;btn.disabled=false;return;}
  }
  btn.disabled=false;
  panel.innerHTML='';
  if(!swapOptions.length){
    panel.textContent='Er zijn geen dienstdagen van andere teams om mee te ruilen.';
    const x=el('button','btn ghost sm');x.textContent='Sluiten';x.style.marginTop='8px';x.onclick=()=>panel.remove();
    panel.appendChild(x);return;
  }
  panel.appendChild(Object.assign(el('div','muted'),
    {textContent:'Ruil '+satLabel(s.date,s.label)+' met:',style:'font-size:12.5px'}));
  const sel=el('select','selin');
  swapOptions.forEach(o=>{
    const op=el('option');op.value=o.sat_id;
    op.textContent=o.t_name+' — '+satLabel(o.sat_date,o.sat_label);
    sel.appendChild(op);
  });
  const note=el('input');note.type='text';note.placeholder='Bericht aan het andere team (optioneel)';
  const acts=el('div','acts');
  const ok=el('button','btn sm');ok.textContent='Voorstel versturen';
  const no=el('button','btn ghost sm');no.textContent='Annuleren';
  no.onclick=()=>panel.remove();
  ok.onclick=()=>swapCreate({p_code:session.code,p_kind:'ruil',p_from_saturday:s.id,
    p_to_saturday:sel.value,p_note:note.value.trim()},ok);
  acts.appendChild(ok);acts.appendChild(no);
  panel.appendChild(sel);panel.appendChild(note);panel.appendChild(acts);
}
async function swapCreate(args,btn){
  btn.disabled=true;const t=btn.textContent;btn.textContent='Bezig…';
  try{await rpc('team_swap_create',args);swapOptions=null;saved('Verzoek verstuurd ✓');await renderTeamView();}
  catch(e){alert(e.message);btn.disabled=false;btn.textContent=t;}
}
async function swapAct(id,action,btn){
  btn.disabled=true;const t=btn.textContent;btn.textContent='Bezig…';
  try{await rpc('team_swap_respond',{p_code:session.code,p_id:id,p_action:action});
    swapOptions=null;saved('Bijgewerkt ✓');await renderTeamView();}
  catch(e){alert(e.message);btn.disabled=false;btn.textContent=t;}
}
function swapRow(title,lines){
  const row=el('div','swaprow');
  row.appendChild(Object.assign(el('div','ttl'),{textContent:title}));
  lines.filter(Boolean).forEach(t=>row.appendChild(Object.assign(el('div','meta'),{textContent:t})));
  return row;
}
function swapSection(){
  const inc=swapList.filter(r=>r.direction==='in'&&r.req_status==='open');
  const board=swapList.filter(r=>r.direction==='prikbord'&&r.req_kind==='overname'&&r.req_status==='open');
  const mine=swapList.filter(r=>r.direction==='uit'&&['open','wacht_barco'].includes(r.req_status));
  const done=swapList.filter(r=>['goedgekeurd','afgewezen','geweigerd','ingetrokken'].includes(r.req_status)&&r.direction!=='prikbord');
  const c=el('div','card');
  c.innerHTML='<h3>Ruilen</h3><p class="muted" style="margin-top:0;font-size:12.5px">Een ruil gaat pas door als het andere team akkoord is én de kantinecoördinator hem goedkeurt.</p>';

  if(inc.length){
    c.appendChild(Object.assign(el('div','swapsub'),{textContent:'Voorstellen aan jouw team'}));
    inc.forEach(r=>{
      const row=swapRow(r.from_team_name+' wil ruilen',[
        'Jullie draaien dan '+satLabel(r.from_sat_date,r.from_sat_label)+' in plaats van '+satLabel(r.to_sat_date,r.to_sat_label)+'.',
        r.note?'“'+r.note+'”':null]);
      const acts=el('div','acts');
      const y=el('button','btn sm');y.textContent='Akkoord';y.onclick=()=>swapAct(r.req_id,'accepteer',y);
      const n=el('button','btn ghost sm');n.textContent='Weigeren';n.onclick=()=>swapAct(r.req_id,'weiger',n);
      acts.appendChild(y);acts.appendChild(n);row.appendChild(acts);c.appendChild(row);
    });
  }
  if(board.length){
    c.appendChild(Object.assign(el('div','swapsub'),{textContent:'Prikbord — diensten die andere teams aanbieden'}));
    board.forEach(r=>{
      const row=swapRow(r.from_team_name+' biedt aan: '+satLabel(r.from_sat_date,r.from_sat_label),
        [r.note?'“'+r.note+'”':null,'Neem je dit over, dan draait jouw team deze dag extra.']);
      const acts=el('div','acts');
      const y=el('button','btn sm');y.textContent='Overnemen';y.onclick=()=>swapAct(r.req_id,'claim',y);
      acts.appendChild(y);row.appendChild(acts);c.appendChild(row);
    });
  }
  if(mine.length){
    c.appendChild(Object.assign(el('div','swapsub'),{textContent:'Verzoeken van jouw team'}));
    mine.forEach(r=>{
      const row=swapRow(r.req_kind==='overname'
          ? 'Aangeboden: '+satLabel(r.from_sat_date,r.from_sat_label)
          : 'Ruilvoorstel aan '+(r.to_team_name||'ander team'),
        [r.req_kind==='ruil'?satLabel(r.from_sat_date,r.from_sat_label)+' ↔ '+satLabel(r.to_sat_date,r.to_sat_label):null,
         r.req_status==='wacht_barco'?'Het andere team is akkoord. De coördinator moet nog goedkeuren.':null]);
      const acts=el('div','acts');
      acts.appendChild(swapChip(r.req_status));
      const b=el('button','btn ghost sm');b.textContent='Intrekken';b.onclick=()=>swapAct(r.req_id,'intrek',b);
      acts.appendChild(b);row.appendChild(acts);c.appendChild(row);
    });
  }
  if(swapLoadFout){
    const w=el('div','swaprow');
    w.appendChild(Object.assign(el('div','ttl'),{textContent:'Ruilverzoeken konden niet worden opgehaald'}));
    w.appendChild(Object.assign(el('div','meta'),{textContent:'Er kan een voorstel klaarstaan dat je nu niet ziet. Melding: '+swapLoadFout}));
    const a=el('div','acts');const r=el('button','btn sm');r.textContent='Opnieuw proberen';
    r.onclick=()=>renderTeamView();a.appendChild(r);w.appendChild(a);c.appendChild(w);
  }else if(!inc.length&&!board.length&&!mine.length){
    c.appendChild(Object.assign(el('div','muted'),
      {textContent:'Geen openstaande ruilverzoeken. Gebruik de knoppen bij een dienstdag hierboven.',style:'font-size:12.5px;margin-top:10px'}));
  }
  if(done.length){
    c.appendChild(Object.assign(el('div','swapsub'),{textContent:'Afgehandeld'}));
    done.slice(0,5).forEach(r=>{
      const row=el('div','swaprow');
      const t=r.req_kind==='overname'
        ? 'Aanbod '+satLabel(r.from_sat_date,r.from_sat_label)
        : satLabel(r.from_sat_date,r.from_sat_label)+' ↔ '+satLabel(r.to_sat_date,r.to_sat_label);
      row.appendChild(Object.assign(el('div','meta'),{textContent:t}));
      const a=el('div','acts');a.appendChild(swapChip(r.req_status));
      if(r.barco_note)a.appendChild(Object.assign(el('span','meta'),{textContent:'“'+r.barco_note+'”'}));
      row.appendChild(a);c.appendChild(row);
    });
  }
  return c;
}

/* ---------- Ruilen: coördinator en beheerder ---------- */
let swapAdmin=[],swapShowAll=false;
async function authRpc(fn,args){
  const r=await authFetch('/rest/v1/rpc/'+fn,{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify(args||{})});
  const j=await r.json().catch(()=>null);
  if(!r.ok)throw new Error((j&&(j.message||j.hint))||('Serverfout ('+r.status+')'));
  return j;

/* ---------- Opslaan van afgevinkte taken ----------
   Per zaterdag een eigen timer, en vlak voor het wegschrijven halen we de
   serverversie op en zetten we alleen onze eigen wijzigingen daar overheen.
   Zo blijft invoer van iemand anders staan. */
const saveJobs=new Map();
function markCell(s,blockId,idx){
  let job=saveJobs.get(s.id);
  if(!job){job={sat:s,touched:new Set(),timer:null,busy:false};saveJobs.set(s.id,job);}
  job.sat=s;job.touched.add(blockId+'\u0000'+idx);
  clearTimeout(job.timer);
  job.timer=setTimeout(()=>flushStatus(s.id),600);
}
async function serverStatus(satId){
  if(session.kind==='team'){
    const rows=await rpc('team_saturdays',{p_code:session.code});
    const row=rows.find(r=>r.id===satId);
    return row?(row.team_status||{}):null;
  }
  const rows=await sbGet('saturdays?select=team_status&id=eq.'+encodeURIComponent(satId));
  return rows.length?(rows[0].team_status||{}):null;
}
function schrijfStatus(satId,status){
  if(session.kind==='team')return rpc('team_set_status',{p_code:session.code,p_saturday_id:satId,p_status:status});
  return sbSend('PATCH','saturdays?id=eq.'+encodeURIComponent(satId),{team_status:status});
}
function mergeStatus(server,mine,touched){
  const out=JSON.parse(JSON.stringify(server||{}));
  touched.forEach(key=>{
    const p=key.split('\u0000'),blk=p[0],idx=Number(p[1]);
    const mijn=(mine&&mine[blk])||[];
    if(!Array.isArray(out[blk]))out[blk]=[];
    while(out[blk].length<Math.max(mijn.length,idx+1))out[blk].push({done:false,name:''});
    out[blk][idx]=mijn[idx]||{done:false,name:''};
  });
  return out;
}
async function flushStatus(satId){
  const job=saveJobs.get(satId);
  if(!job||job.busy)return;
  job.busy=true;clearTimeout(job.timer);
  const touched=job.touched;job.touched=new Set();
  try{
    let server=null;
    try{server=await serverStatus(satId);}catch(e){server=null;}
    const mine=job.sat.team_status||{};
    const merged=server?mergeStatus(server,mine,touched):mine;
    const ookVanAnder=JSON.stringify(merged)!==JSON.stringify(mine);
    await schrijfStatus(satId,merged);
    job.sat.team_status=merged;
    saved(ookVanAnder?'Opgeslagen ✓ — ook invoer van een ander verwerkt':'Opgeslagen ✓');
    if(ookVanAnder)hertekenNaSamenvoegen();
  }catch(e){
    touched.forEach(k=>job.touched.add(k));
    saved('Opslaan mislukt — we proberen het zo nog een keer',true);
  }finally{
    job.busy=false;
    if(job.touched.size){clearTimeout(job.timer);job.timer=setTimeout(()=>flushStatus(satId),2000);}
    else saveJobs.delete(satId);
  }
}

const ROLEMAP={'':'vast','vast':'vast','vaste bar-kracht':'vast','vaste kracht':'vast','kracht':'vast','barco':'barco','coordinator':'barco','coördinator':'barco','bar coördinator':'barco','bar coordinator':'barco','admin':'admin','beheerder':'admin'};
async function importAccounts(rows){
  const out=[];
  for(const r of rows){
    const naam=(r.naam||r.name||'').trim(), email=(r.email||r['e-mail']||r.mail||'').trim();
    let role=ROLEMAP[(r.rol||r.role||'').trim().toLowerCase()]||'vast';
    if(!naam||!email){out.push({naam,email,status:'overgeslagen (naam/e-mail leeg)'});continue;}
    try{
      const pass=sterkWachtwoord();
      const sr=await fetch(`${SB_URL}/auth/v1/signup`,{method:'POST',headers:{apikey:SB_KEY,'Content-Type':'application/json'},body:JSON.stringify({email,password:pass})});
      const sj=await sr.json();const uid=sj.id||(sj.user&&sj.user.id);
      if(!sr.ok||!uid)throw new Error(sj.msg||sj.error_description||'e-mail ongeldig of al in gebruik');
      await sbSend('POST','profiles',{id:uid,name:naam,role});
      if(role==='vast')await sbSend('POST','bar_staff',{name:naam,user_id:uid});
      out.push({naam,email,pass,role,status:'ok'});
    }catch(e){out.push({naam,email,status:'fout: '+e.message});}
  }
  return out;
}
function splitCSV(line,sep){const o=[];let cur='',q=false;for(let i=0;i<line.length;i++){const ch=line[i];if(q){if(ch==='"'){if(line[i+1]==='"'){cur+='"';i++;}else q=false;}else cur+=ch;}else{if(ch==='"')q=true;else if(ch===sep){o.push(cur);cur='';}else cur+=ch;}}o.push(cur);return o;}
function parseCSV(txt){const lines=txt.replace(/\r/g,'').split('\n').filter(l=>l.trim());if(!lines.length)return[];const sep=(lines[0].split(';').length>lines[0].split(',').length)?';':',';const hdr=splitCSV(lines[0],sep).map(h=>h.trim().toLowerCase());return lines.slice(1).map(l=>{const c=splitCSV(l,sep);const o={};hdr.forEach((h,i)=>o[h]=(c[i]||'').trim());return o;});}
async function loadXLSX(){if(window.XLSX)return;await new Promise((res,rej)=>{const s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js';s.onload=res;s.onerror=()=>rej(new Error('kon Excel-lezer niet laden — sla op als CSV'));document.head.appendChild(s);});}
async function parseSheet(file){
  const nm=file.name.toLowerCase();
  if(nm.endsWith('.csv')){return parseCSV(await file.text());}
  await loadXLSX();
  const wb=XLSX.read(await file.arrayBuffer(),{type:'array'});
  const ws=wb.Sheets[wb.SheetNames[0]];
  return XLSX.utils.sheet_to_json(ws,{defval:''}).map(o=>{const n={};Object.keys(o).forEach(k=>n[String(k).trim().toLowerCase()]=String(o[k]).trim());return n;});
}
function generateCard(){
  const c=el('div','card');c.innerHTML='<h3>Zaterdagen genereren</h3>';

  rr.appendChild(cbx);rr.appendChild(Object.assign(el('span'),{textContent:'Teams om de beurt toewijzen'}));c.appendChild(rr);
  const btn=el('button','btn sm');btn.textContent='Genereren';
  btn.onclick=async()=>{
    const start=di.value,weeks=Math.max(1,parseInt(wi.value)||1);if(!start){saved('Kies een startdatum',true);return;}
    const base=new Date(start+'T12:00:00');
    if(base.getDay()!==6&&!confirm('Let op: '+fmtDay(start)+' is geen zaterdag.\n\nToch '+weeks+' dagen vanaf deze dag aanmaken, elke week op dezelfde dag?'))return;
    btn.disabled=true;btn.textContent='Bezig…';
    try{
      const existing=new Set(data.saturdays.map(s=>s.date));
      const teamsSorted=data.teams.slice().sort((a,b)=>(a.sort||0)-(b.sort||0));
      // doortellen vanaf het laatst toegewezen team, zodat de eerste teams niet steeds vooraan staan
      let ti=0;
      if(cbx.checked&&teamsSorted.length){
        const metTeam=data.saturdays.filter(s=>s.team).slice().sort((a,b)=>a.date.localeCompare(b.date));
        const laatste=metTeam.length?metTeam[metTeam.length-1].team:null;
        const idx=teamsSorted.findIndex(t=>t.id===laatste);
        if(idx>=0)ti=idx+1;
      }
      const rows=[];
      for(let i=0;i<weeks;i++){const d=new Date(base);d.setDate(d.getDate()+i*7);const iso=fmtISO(d);
        if(existing.has(iso))continue;
        const team=cbx.checked&&teamsSorted.length?teamsSorted[ti++%teamsSorted.length].id:null;
        rows.push({id:crypto.randomUUID(),date:iso,team_id:team});}
      if(!rows.length){saved('Geen nieuwe zaterdagen (bestaan al)');btn.disabled=false;btn.textContent='Genereren';return;}
      // per dag opslaan: één dag die al bestaat laat de rest nu gewoon doorgaan
      let gelukt=0;const mislukt=[];
      for(const row of rows){
        try{await sbSend('POST','saturdays',row);gelukt++;}
        catch(e){mislukt.push(fmtShort(row.date));}
      }
      beheerNotice=`${gelukt} dienstdag(en) toegevoegd.`+(mislukt.length?` Niet gelukt: ${escapeHtml(mislukt.join(', '))}.`:'');
      if(!gelukt)saved('Geen enkele dag toegevoegd',true);
      await loadData();renderAccTab();
    }catch(e){saved('Fout: '+e.message,true);btn.disabled=false;btn.textContent='Genereren';}
  };
  c.appendChild(btn);
  c.appendChild(Object.assign(el('span','muted'),{textContent:' bestaande zaterdagen blijven behouden',style:'font-size:12px;margin-left:8px'}));
  return c;
}

    const as=el('button','btn sm ghost');as.textContent='+ tijdvak';as.onclick=()=>{shifts.push({label:'Tijdvak',start:'08:00',end:'12:00'});renderEd();};ed.appendChild(as);
  }
  cbx.onchange=()=>{ed.classList.toggle('hide',!cbx.checked);if(cbx.checked&&!ed.childNodes.length)renderEd();};
  c.appendChild(ed);
  const btn=el('button','btn sm');btn.textContent='Dienstdag toevoegen';btn.style.marginTop='12px';
  btn.onclick=async()=>{
    const date=di.value;if(!date){saved('Kies een datum',true);return;}
    const row={id:crypto.randomUUID(),date,team_id:tsel.value||null,label:lab.value.trim()};
    if(cbx.checked){
      if(!blocks.length||!shifts.length){saved('Voeg minstens één blok en tijdvak toe',true);return;}
      row.blocks=blocks.map((b,i)=>({id:'b'+(i+1),label:b.label||('Blok '+(i+1)),start:b.start,end:b.end,tasks:b.tasks.length?b.tasks:['Bar']}));
      row.bar_shifts=shifts.map((v,i)=>({id:'v'+(i+1),label:v.label||('Tijdvak '+(i+1)),start:v.start,end:v.end}));
    }
    btn.disabled=true;btn.textContent='Bezig…';
    try{await sbSend('POST','saturdays',row);beheerNotice='Dienstdag toegevoegd.';await loadData();renderAccTab();}
    catch(e){saved('Fout: '+e.message,true);btn.disabled=false;btn.textContent='Dienstdag toevoegen';}
  };
  c.appendChild(btn);
  return c;
}
const lichtingOf=name=>{const m=(name||'').match(/^(JO\d+|MO\d+)/i);return m?m[1].toUpperCase():'Senioren';};
const lichtingList=()=>[...new Set(data.teams.map(t=>lichtingOf(t.name)))].sort((a,b)=>a.localeCompare(b,undefined,{numeric:true}));
let rf={mode:'komend',groep:'',team:'',staff:''};
function renderRoosterTab(){
  const wrap=$('#content');wrap.innerHTML='';
  wrap.appendChild(Object.assign(el('h2','tabttl'),{textContent:'Rooster'}));
  const t={admin:'Wijs teams toe, vink af en beheer de bar.',barco:'Vul per zaterdag de vaste bar-krachten in.',vast:'Vul de vaste bar-diensten in — je mag alle zaterdagen.'};
  wrap.appendChild(Object.assign(el('p','muted'),{textContent:t[session.role]||'',style:'margin:0 0 8px'}));
  if(!data.saturdays.length){wrap.appendChild(Object.assign(el('div','empty'),{textContent:'Nog geen zaterdagen.'}));return;}
  const fb=el('div','filterbar');
  const mkf=(label,opts,val,on)=>{const w=el('label','fitem');w.appendChild(Object.assign(el('span'),{textContent:label}));const s=el('select','selin');opts.forEach(([v,tx])=>{const o=el('option');o.value=v;o.textContent=tx;s.appendChild(o);});s.value=val;s.onchange=()=>{on(s.value);renderRoosterTab();};w.appendChild(s);fb.appendChild(w);};
  mkf('Toon',[['komend','Komende zaterdagen'],['open','Alleen open (komend)'],['all','Alles, ook afgelopen']],rf.mode,v=>rf.mode=v);
  mkf('Groep',[['','Alle groepen'],...lichtingList().map(g=>[g,g])],rf.groep,v=>{rf.groep=v;rf.team='';});
  mkf('Team',[['','Alle teams'],...data.teams.filter(t=>!rf.groep||lichtingOf(t.name)===rf.groep).map(t=>[t.id,t.name])],rf.team,v=>rf.team=v);
  mkf('Vaste kracht',[['','Iedereen'],...data.barStaff.slice().sort((a,b)=>a.name.localeCompare(b.name)).map(s=>[s.id,s.name])],rf.staff,v=>rf.staff=v);
  wrap.appendChild(fb);
  let list=data.saturdays.slice();
  if(rf.mode!=='all')list=list.filter(komend);
  if(rf.mode==='open')list=list.filter(s=>{const tt=teamTotals(s);return barGaps(s)>0||(tt.total>0&&tt.done<tt.total);});
  if(rf.groep)list=list.filter(s=>s.team&&lichtingOf(teamName(s.team))===rf.groep);
  if(rf.team)list=list.filter(s=>s.team===rf.team);
  if(rf.staff)list=list.filter(s=>dayShifts(s).some(sh=>(s.bar[sh.id]||[]).includes(rf.staff)));
  const active=rf.mode!=='komend'||rf.groep||rf.team||rf.staff;
  const afgelopen=data.saturdays.length-data.saturdays.filter(komend).length;
  wrap.appendChild(Object.assign(el('div','muted'),
    {textContent:`${list.length} van ${data.saturdays.length} zaterdagen${active?' (gefilterd)':''}`
      +(rf.mode!=='all'&&afgelopen?` · ${afgelopen} afgelopen zaterdag(en) verborgen`:''),
     style:'font-size:12.5px;margin:2px 0 10px'}));
  if(!list.length){wrap.appendChild(Object.assign(el('div','empty'),{textContent:'Geen zaterdagen die aan het filter voldoen.'}));return;}
  list.forEach(s=>wrap.appendChild(accSatCard(s)));
}

let adminOvSub='tot';

let ovAlles=false;
function ovSchakelaar(wrap,hertekenen){
  const l=el('label','row');l.style.margin='0 0 10px';
  const cb=el('input');cb.type='checkbox';cb.checked=ovAlles;cb.style.width='18px';cb.style.height='18px';
  cb.onchange=()=>{ovAlles=cb.checked;hertekenen();};
  l.appendChild(cb);l.appendChild(Object.assign(el('span','muted'),{textContent:'Ook afgelopen zaterdagen tonen',style:'font-size:12.5px'}));
  wrap.appendChild(l);
}
function renderBarGrid(wrap){
  wrap.appendChild(Object.assign(el('h2','tabttl'),{textContent:'Overzicht bar'}));
  const dagen=ovAlles?data.saturdays:data.saturdays.filter(komend);
  const gaps=dagen.reduce((n,s)=>n+(barGaps(s)>0?1:0),0);
  const bn=el('div','banner'+(gaps?'':' good'));
  bn.textContent=data.barStaff.length
    ? (gaps?`⚠ ${gaps} ${ovAlles?'zaterdag(en)':'komende zaterdag(en)'} missen nog een vaste bar-kracht.`
           :`✔ Alle ${ovAlles?'zaterdagen':'komende zaterdagen'} hebben bar-dekking.`)
    : 'Nog geen vaste krachten — de beheerder voegt ze toe.';
  wrap.appendChild(bn);
  ovSchakelaar(wrap,()=>renderAccTab());
  const ovw=el('div','ovwrap');const tbl=el('table','ovtable');
  const thead=el('thead'),hr=el('tr');
  ['Datum','Team',...config.bar_shifts.map(sh=>`${sh.label} (${sh.start}–${sh.end})`)].forEach(h=>{const th=el('th');th.textContent=h;hr.appendChild(th);});
  thead.appendChild(hr);tbl.appendChild(thead);
  const tb=el('tbody');
  dagen.forEach(s=>{
    const tr=el('tr');
    tr.appendChild(Object.assign(el('td','ovdate'),{textContent:fmtShort(s.date)}));
    tr.appendChild(Object.assign(el('td','ovteam'),{textContent:s.team?teamName(s.team):'—'}));
    if(stdShifts(s)){config.bar_shifts.forEach(sh=>{
      const ids=(s.bar[sh.id]||[]);const td=el('td','ovcell'+(ids.length?'':' gap'));
      if(!ids.length)td.appendChild(Object.assign(el('span','warnv'),{textContent:'⚠ leeg'}));
      ids.forEach(id=>{const ch=el('span','chip staff');ch.textContent=staffName(id);
        if(session.role==='admin'||session.role==='barco'||id===myStaffId){
          const x=el('span','x');x.textContent='×';x.title='Weghalen';x.onclick=async()=>{
            if(!confirm(staffName(id)+' weghalen bij '+sh.label.toLowerCase()+' op '+fmtShort(s.date)+'?'))return;
            try{await delBar(s,sh,id);saved();renderAccTab();}catch(e){saved('Fout',true);}};
          ch.appendChild(x);
        }
        td.appendChild(ch);});
      const avail=data.barStaff.filter(st=>!ids.includes(st.id));
      if(avail.length){const add=el('select','selin miniadd');const ph=el('option');ph.value='';ph.textContent='+ toevoegen';add.appendChild(ph);
        avail.forEach(st=>{const o=el('option');o.value=st.id;o.textContent=st.name;add.appendChild(o);});
        add.onchange=async()=>{if(!add.value)return;try{await addBar(s,sh,add.value);saved();renderAccTab();}catch(e){saved('Fout',true);}};td.appendChild(add);}
      tr.appendChild(td);
    });}else{const td=el('td','ovcell');td.colSpan=config.bar_shifts.length;td.innerHTML='<span class="warnv">⚠ eigen tijden</span> — vul in via het Rooster';tr.appendChild(td);}
    tb.appendChild(tr);
  });
  tbl.appendChild(tb);ovw.appendChild(tbl);wrap.appendChild(ovw);
  // diensten-teller
  const card=el('div','card');card.style.marginTop='12px';
  card.appendChild(Object.assign(el('h3'),{textContent:'Diensten per vaste kracht',style:'margin-top:0'}));
  card.appendChild(Object.assign(el('p','muted'),{textContent:'Gedraaid = zaterdagen die al voorbij zijn · Gepland = nog komend',style:'margin:-4px 0 8px;font-size:12px'}));
  const wl=el('div');renderTeller(wl);card.appendChild(wl);wrap.appendChild(card);
}
function renderTeller(wrap){
  if(!data.barStaff.length){wrap.innerHTML='<span class="muted">Nog geen vaste krachten.</span>';return;}
  const today=todayISO(),stat={};data.barStaff.forEach(s=>stat[s.id]={done:0,planned:0});
  data.saturdays.forEach(s=>{const past=s.date<today;dayShifts(s).forEach(sh=>(s.bar[sh.id]||[]).forEach(id=>{if(stat[id])stat[id][past?'done':'planned']++;}));});
  const tot=id=>stat[id].done+stat[id].planned,max=Math.max(1,...data.barStaff.map(s=>tot(s.id)));
  const tbl=el('table','wltable');
  tbl.innerHTML='<thead><tr><th>Vaste kracht</th><th class="num">Gedraaid</th><th class="num">Gepland</th><th class="num">Totaal</th></tr></thead>';
  const tb=el('tbody');
  data.barStaff.slice().sort((a,b)=>stat[b.id].done-stat[a.id].done||tot(b.id)-tot(a.id)||a.name.localeCompare(b.name)).forEach(s=>{
    const st=stat[s.id],t=tot(s.id),tr=el('tr');
    tr.innerHTML=`<td><span class="chip staff">${escapeHtml(s.name)}</span></td><td class="num"><span class="done">${st.done}</span></td><td class="num">${st.planned}</td><td class="num"><span class="wlbar" style="width:${Math.round(t/max*46)}px"></span> ${t}</td>`;
    tb.appendChild(tr);
  });
  tbl.appendChild(tb);wrap.appendChild(tbl);
}
function renderTotaal(wrap){
  wrap.appendChild(Object.assign(el('h2','tabttl'),{textContent:'Totaaloverzicht'}));
  const dagen=ovAlles?data.saturdays:data.saturdays.filter(komend);
  let vol=0;dagen.forEach(s=>{const t=teamTotals(s);if(t.total&&t.done===t.total)vol++;});
  const openBar=dagen.reduce((n,s)=>n+(barGaps(s)>0?1:0),0),n=dagen.length;
  const bn=el('div','banner'+((n-vol===0&&openBar===0)?' good':''));
  bn.textContent=(n-vol===0&&openBar===0)
    ?`✔ Alles rond: ${ovAlles?'alle zaterdagen':'alle komende zaterdagen'} afgevinkt én bar gedekt.`
    :`📋 ${n-vol} ${ovAlles?'zaterdag(en)':'komende zaterdag(en)'} nog niet volledig afgevinkt · ${openBar} met een openstaand bar-slot.`;
  wrap.appendChild(bn);
  ovSchakelaar(wrap,()=>renderAccTab());
  const ovw=el('div','ovwrap');const tbl=el('table','ovtable');
  tbl.innerHTML='<thead><tr><th>Datum</th><th>Team</th><th>Blokken afgevinkt</th><th>Bar</th></tr></thead>';
  const tb=el('tbody');
  dagen.forEach(s=>{
    const t=teamTotals(s),done=(t.total&&t.done===t.total);
    const tr=el('tr');
    tr.appendChild(Object.assign(el('td','ovdate'),{textContent:fmtShort(s.date)}));
    tr.appendChild(Object.assign(el('td','ovteam'),{textContent:s.team?teamName(s.team):'—'}));
    const td3=el('td');const pr=el('div','progress');pr.style.margin='0 0 5px';const bar=el('i');bar.style.width=(t.total?Math.round(t.done/t.total*100):0)+'%';pr.appendChild(bar);td3.appendChild(pr);
    td3.appendChild(Object.assign(el('div'),{textContent:done?'✔ volledig':`${t.bf}/${t.bc} blokken · ${t.done}/${t.total} taken`,style:'font-size:12px;color:'+(done?'#7ee2a4':'var(--muted)')}));
    tr.appendChild(td3);
    const td4=el('td');td4.style.whiteSpace='nowrap';td4.style.fontSize='12.5px';
    dayShifts(s).forEach(sh=>{const has=(s.bar[sh.id]||[]).length>0;const d=el('div');d.style.color=has?'#7ee2a4':'var(--gold)';d.textContent=(has?'✓ ':'⚠ ')+sh.label;td4.appendChild(d);});
    tr.appendChild(td4);tb.appendChild(tr);
  });
  tbl.appendChild(tb);ovw.appendChild(tbl);wrap.appendChild(ovw);
}
function fmtShort(iso){return capF(new Date(iso+'T00:00:00').toLocaleDateString('nl-NL',{weekday:'short',day:'numeric',month:'short'}));}
function renderPrint(){
  const area=$('#printArea');
  const now=new Date().toLocaleDateString('nl-NL',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
  let h=`<h1>${escapeHtml(config.club)}</h1><div class="psub">Kantinerooster · afgedrukt op ${now}</div>`;
  if(session.kind==='team'){
    h+=`<h2>Kantinedienst — team ${escapeHtml(session.teamName)}</h2>`;
    const sats=teamSats.slice().sort((a,b)=>a.date.localeCompare(b.date));
    if(!sats.length)h+='<p>Geen diensten ingepland.</p>';
    sats.forEach(s=>{
      h+=`<h2 style="font-size:14px">${escapeHtml(capF(fmtDay(s.date)))}</h2>`;
      h+='<table><tr><th style="width:32%">Blok</th><th>Taak</th><th style="width:34%">Naam vrijwilliger</th></tr>';
      dayBlocks(s).forEach(b=>{const a=blockArr(s.team_status,b);b.tasks.forEach((task,i)=>{const nm=(a[i]&&a[i].name)?escapeHtml(a[i].name):'<span class="fill">………………………</span>';h+=`<tr><td>${i===0?escapeHtml(b.label+' · '+b.start+'–'+b.end):''}</td><td>${escapeHtml(task)}</td><td>${nm}</td></tr>`;});});
      h+='</table>';
    });
  }else{
    h+='<h2>Seizoensrooster</h2>';
    const barHeads=config.bar_shifts.map(sh=>`<th>${escapeHtml('Bar '+sh.label.toLowerCase()+' ('+sh.start+'–'+sh.end+')')}</th>`).join('');
    h+=`<table><tr><th>Datum</th><th>Team</th>${barHeads}</tr>`;
    data.saturdays.forEach(s=>{
      let cells;
      if(stdShifts(s)){
        cells=config.bar_shifts.map(sh=>{const names=(s.bar[sh.id]||[]).map(staffName).join(', ');
          return `<td>${names?escapeHtml(names):'<span class="fill">…………</span>'}</td>`;}).join('');
      }else{
        // afwijkende tijden (bijvoorbeeld een toernooidag): eigen tijdvakken in één cel
        const eigen=dayShifts(s).map(sh=>{const names=(s.bar[sh.id]||[]).map(staffName).join(', ');
          return `${escapeHtml(sh.label+' '+sh.start+'–'+sh.end)}: ${names?escapeHtml(names):'<span class="fill">………</span>'}`;}).join(' · ');
        cells=`<td colspan="${config.bar_shifts.length}">${eigen}</td>`;
      }
      h+=`<tr><td>${escapeHtml(fmtShort(s.date))}</td><td>${s.team?escapeHtml(teamName(s.team)):'—'}</td>${cells}</tr>`;
    });
    h+='</table>';
    if(session.role==='admin'&&data.codes&&Object.keys(data.codes).length){
      h+='<h2>Teamcodes (voor de teamleiders)</h2><table><tr><th>Team</th><th>Code</th></tr>';
      data.teams.forEach(t=>{h+=`<tr><td>${escapeHtml(t.name)}</td><td>${escapeHtml(data.codes[t.id]||'')}</td></tr>`;});
      h+='</table>';
    }
  }
  area.innerHTML=h;window.print();
}
